apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: srecon26-local}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: srecon26-phase1-prometheus}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: srecon26-phase1-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: srecon26-phase1-prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: srecon26-local}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: srecon26-local}
data:
  prometheus.yml: |
    global: {scrape_interval: 5s, evaluation_interval: 5s}
    scrape_configs:
      - job_name: pods
        kubernetes_sd_configs: [{role: pod, namespaces: {names: [srecon26-local]}}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true"}
          - {source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port], action: replace, target_label: __address__, regex: '([^:]+)(?::\\d+)?;(\\d+)', replacement: '$1:$2'}
          - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
          - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: srecon26-local}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.2
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{name: http, containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes: [{name: config, configMap: {name: prometheus-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: srecon26-local}
spec: {selector: {app: prometheus}, ports: [{name: http, port: 9090, targetPort: http}]}
