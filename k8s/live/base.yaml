apiVersion: v1
kind: Namespace
metadata: {name: srecon26-local}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hpa-target, namespace: srecon26-local}
spec:
  replicas: 1
  selector: {matchLabels: {app: hpa-target}}
  template:
    metadata:
      labels: {app: hpa-target}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics}
    spec:
      containers:
        - name: server
          image: srecon26-phase1-mock:local
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8000}]
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: "1", memory: 128Mi}}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: hpa-target, namespace: srecon26-local}
spec: {selector: {app: hpa-target}, ports: [{name: http, port: 8000, targetPort: http}]}
