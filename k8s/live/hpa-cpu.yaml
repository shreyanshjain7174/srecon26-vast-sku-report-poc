apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: hpa-target, namespace: srecon26-local}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: hpa-target}
  minReplicas: 1
  maxReplicas: 2
  behavior: {scaleUp: {stabilizationWindowSeconds: 0}}
  metrics: [{type: ContainerResource, containerResource: {name: cpu, container: server, target: {type: Utilization, averageUtilization: 60}}}]
