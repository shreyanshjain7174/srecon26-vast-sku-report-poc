apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: hpa-target, namespace: srecon26-local}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: hpa-target}
  minReplicas: 1
  maxReplicas: 2
  behavior: {scaleUp: {stabilizationWindowSeconds: 0}}
  metrics: [{type: Pods, pods: {metric: {name: vllm_kv_cache_usage}, target: {type: AverageValue, averageValue: "0.8"}}}]
