apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: hpa-kv, namespace: srecon26-local}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: hpa-target}
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Pods
      pods: {metric: {name: synthetic_kv_pressure}, target: {type: AverageValue, averageValue: "80"}}
