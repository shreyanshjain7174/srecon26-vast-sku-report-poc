apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: hpa-cpu, namespace: srecon26-local}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: hpa-target}
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}
